# =============================================================================
# MOSY — Mosquitto 2.1.1 Configuration (POC / x86 Development)
# Anonymous local access for edge services on bridge network.
# =============================================================================

# Listener for local edge services (unencrypted, anonymous)
listener 1883
protocol mqtt
allow_anonymous true

# WebSocket listener for tablet PWA
listener 9001
protocol websockets
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# Limits
max_connections -1
max_queued_messages 5000
max_inflight_messages 20
message_size_limit 1048576

# Keepalive
max_keepalive 120
