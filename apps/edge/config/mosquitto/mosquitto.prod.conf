# =============================================================================
# MOSY — Mosquitto 2.1.1 Configuration (Production / Secured)
# Password-based authentication, ACL, TLS 1.3 ready.
# =============================================================================

# ---------------------------------------------------------------------------
# MQTT Listener — TLS (port 8883)
# ---------------------------------------------------------------------------
listener 8883
protocol mqtt

# TLS Configuration (uncomment when certificates are provisioned)
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# tls_version tlsv1.3
# require_certificate false

# ---------------------------------------------------------------------------
# MQTT Listener — local unencrypted (Docker bridge only, not exposed)
# ---------------------------------------------------------------------------
listener 1883 0.0.0.0
protocol mqtt

# ---------------------------------------------------------------------------
# WebSocket Listener — for tablet PWA (TLS recommended in prod)
# ---------------------------------------------------------------------------
listener 9001
protocol websockets

# ---------------------------------------------------------------------------
# Authentication — password file
# ---------------------------------------------------------------------------
allow_anonymous false
password_file /mosquitto/config/passwd

# ---------------------------------------------------------------------------
# Authorization — topic ACL
# ---------------------------------------------------------------------------
acl_file /mosquitto/config/acl

# ---------------------------------------------------------------------------
# Persistence
# ---------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ---------------------------------------------------------------------------
# Limits — hardened
# ---------------------------------------------------------------------------
max_connections 50
max_queued_messages 5000
max_inflight_messages 20
message_size_limit 262144
max_keepalive 120

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
# Prevent $SYS topic access from non-admin clients
# (Handled via ACL file)
