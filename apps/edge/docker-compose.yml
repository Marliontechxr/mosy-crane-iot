# =============================================================================
# MOSY — Edge Platform Docker Compose (x86 POC)
# Phase 3 core + Phase 4 AI services (OCR, Vision, Safety).
# Service code is COPY'd into images via build args (no bind mounts).
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Mosquitto MQTT Broker — local message bus for all edge services
  # ---------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: mosy-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log
    networks:
      - mosy-edge-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Fusion Service — sensor data fusion + cross-validation
  # ---------------------------------------------------------------------------
  fusion-service:
    build:
      context: ../../
      dockerfile: apps/edge/Dockerfile.base
      args:
        SERVICE_SRC: fusion-service
        SERVICE_MODULE: fusion_service
    container_name: mosy-fusion-service
    command: ["python", "-m", "fusion_service.main"]
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      CRANE_ID: ${CRANE_ID:-POC-001}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - mosy-edge-net
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.socket(); s.connect((\"localhost\",8083)); s.close()' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # State Engine — lift, operator, engine state machines
  # ---------------------------------------------------------------------------
  state-engine:
    build:
      context: ../../
      dockerfile: apps/edge/Dockerfile.base
      args:
        SERVICE_SRC: state-engine
        SERVICE_MODULE: state_engine
    container_name: mosy-state-engine
    command: ["python", "-m", "state_engine.main"]
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      CRANE_ID: ${CRANE_ID:-POC-001}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - mosy-edge-net
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.socket(); s.connect((\"localhost\",8085)); s.close()' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # MQTT Bridge — store-and-forward to Azure IoT Hub
  # ---------------------------------------------------------------------------
  mqtt-bridge:
    build:
      context: ../../
      dockerfile: apps/edge/Dockerfile.base
      args:
        SERVICE_SRC: mqtt-bridge
        SERVICE_MODULE: mqtt_bridge
    container_name: mosy-mqtt-bridge
    command: ["python", "-m", "mqtt_bridge.main"]
    volumes:
      - sqlite-data:/app/data
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      CRANE_ID: ${CRANE_ID:-POC-001}
      IOT_HUB_CONNECTION_STRING: ${IOT_HUB_CONNECTION_STRING:-}
      SQLITE_DB_PATH: /app/data/bridge.db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8081:8081"
    networks:
      - mosy-edge-net
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8081/health\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # IoT Agent — Azure IoT Device SDK, twin sync, direct methods
  # ---------------------------------------------------------------------------
  iot-agent:
    build:
      context: ../../
      dockerfile: apps/edge/Dockerfile.base
      args:
        SERVICE_SRC: iot-agent
        SERVICE_MODULE: iot_agent
    container_name: mosy-iot-agent
    command: ["python", "-m", "iot_agent.main"]
    volumes:
      - sqlite-data:/app/data
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      CRANE_ID: ${CRANE_ID:-POC-001}
      IOT_HUB_CONNECTION_STRING: ${IOT_HUB_CONNECTION_STRING:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - mosy-edge-net
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.socket(); s.connect((\"localhost\",8086)); s.close()' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # OCR Service — PaddleOCR dashboard display reader
  # ---------------------------------------------------------------------------
  ocr-service:
    build:
      context: ../../
      dockerfile: apps/edge/Dockerfile.ai
      args:
        SERVICE_SRC: ocr-service
        SERVICE_MODULE: ocr_service
    container_name: mosy-ocr-service
    command: ["python", "-m", "ocr_service.main"]
    volumes:
      - model-cache:/home/mosy/.paddleocr
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      CRANE_ID: ${CRANE_ID:-POC-001}
      CAMERA_SOURCE: ${OCR_CAMERA_SOURCE:-none}
      OCR_FPS: ${OCR_FPS:-5}
      CALIBRATION_PATH: /app/calibrations/poc-crane.json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - mosy-edge-net
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.socket(); s.connect((\"localhost\",8084)); s.close()' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Vision Service — Moondream 2 VLM boom camera analyzer
  # ---------------------------------------------------------------------------
  vision-service:
    build:
      context: ../../
      dockerfile: apps/edge/Dockerfile.ai
      args:
        SERVICE_SRC: vision-service
        SERVICE_MODULE: vision_service
    container_name: mosy-vision-service
    command: ["python", "-m", "vision_service.main"]
    volumes:
      - model-cache:/home/mosy/.cache
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      CRANE_ID: ${CRANE_ID:-POC-001}
      CAMERA_SOURCE: ${BOOM_CAMERA_SOURCE:-none}
      INFERENCE_FPS: ${VISION_FPS:-0.2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - mosy-edge-net
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.socket(); s.connect((\"localhost\",8087)); s.close()' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ---------------------------------------------------------------------------
  # Safety Service — MediaPipe PERCLOS fatigue detection
  # ---------------------------------------------------------------------------
  safety-service:
    build:
      context: ../../
      dockerfile: apps/edge/Dockerfile.ai
      args:
        SERVICE_SRC: safety-service
        SERVICE_MODULE: safety_service
    container_name: mosy-safety-service
    command: ["python", "-m", "safety_service.main"]
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      CRANE_ID: ${CRANE_ID:-POC-001}
      CAMERA_SOURCE: ${CABIN_CAMERA_SOURCE:-none}
      INFERENCE_FPS: ${SAFETY_FPS:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - mosy-edge-net
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.socket(); s.connect((\"localhost\",8088)); s.close()' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  mosy-edge-net:
    driver: bridge

volumes:
  mosquitto-data:
  mosquitto-logs:
  sqlite-data:
  model-cache:
