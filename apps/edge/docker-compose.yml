# =============================================================================
# MOSY — Edge Platform Docker Compose (x86 POC)
# Phase 3: Core services only. OCR/vision/safety added in Phase 4.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Mosquitto MQTT Broker — local message bus for all edge services
  # ---------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: mosy-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log
    networks:
      - mosy-edge-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Fusion Service — sensor data fusion + cross-validation
  # ---------------------------------------------------------------------------
  fusion-service:
    build:
      context: ../../
      dockerfile: apps/edge/Dockerfile.base
    container_name: mosy-fusion-service
    command: ["python", "-m", "fusion_service.main"]
    volumes:
      - ./services/fusion-service:/app/fusion_service:ro
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      CRANE_ID: ${CRANE_ID:-POC-001}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - mosy-edge-net
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.socket(); s.connect((\"localhost\",8083)); s.close()' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # State Engine — lift, operator, engine state machines
  # ---------------------------------------------------------------------------
  state-engine:
    build:
      context: ../../
      dockerfile: apps/edge/Dockerfile.base
    container_name: mosy-state-engine
    command: ["python", "-m", "state_engine.main"]
    volumes:
      - ./services/state-engine:/app/state_engine:ro
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      CRANE_ID: ${CRANE_ID:-POC-001}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - mosy-edge-net
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.socket(); s.connect((\"localhost\",8085)); s.close()' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # MQTT Bridge — store-and-forward to Azure IoT Hub
  # ---------------------------------------------------------------------------
  mqtt-bridge:
    build:
      context: ../../
      dockerfile: apps/edge/Dockerfile.base
    container_name: mosy-mqtt-bridge
    command: ["python", "-m", "mqtt_bridge.main"]
    volumes:
      - ./services/mqtt-bridge:/app/mqtt_bridge:ro
      - sqlite-data:/app/data
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      CRANE_ID: ${CRANE_ID:-POC-001}
      IOT_HUB_CONNECTION_STRING: ${IOT_HUB_CONNECTION_STRING:-}
      SQLITE_DB_PATH: /app/data/bridge.db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8081:8081"
    networks:
      - mosy-edge-net
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8081/health\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # IoT Agent — Azure IoT Device SDK, twin sync, direct methods
  # ---------------------------------------------------------------------------
  iot-agent:
    build:
      context: ../../
      dockerfile: apps/edge/Dockerfile.base
    container_name: mosy-iot-agent
    command: ["python", "-m", "iot_agent.main"]
    volumes:
      - ./services/iot-agent:/app/iot_agent:ro
      - sqlite-data:/app/data
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      CRANE_ID: ${CRANE_ID:-POC-001}
      IOT_HUB_CONNECTION_STRING: ${IOT_HUB_CONNECTION_STRING:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - mosy-edge-net
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.socket(); s.connect((\"localhost\",8086)); s.close()' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  mosy-edge-net:
    driver: bridge

volumes:
  mosquitto-data:
  mosquitto-logs:
  sqlite-data:
