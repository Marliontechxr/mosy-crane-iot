; PlatformIO configuration for MOSY ESP32-S3 Boom Sensor Unit
; Blueprint Section 7 — ESP-IDF 5.5.2 / Arduino 3.3.6

[env:esp32-s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3

monitor_speed = 115200
upload_speed = 921600

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

; Library dependencies
lib_deps =
    knolleary/PubSubClient@^2.8.0
    bblanchon/ArduinoJson@^6.21.3
    adafruit/Adafruit BNO055@^1.1.14
    adafruit/Adafruit Unified Sensor@^1.1.14

; Native test environment for unit tests (runs on host, not ESP32)
[env:native]
platform = native
build_flags = -std=c++17
test_framework = unity
lib_deps =
    bblanchon/ArduinoJson@^6.21.3
