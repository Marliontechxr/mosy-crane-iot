# =============================================================================
# MOSY — Prometheus Configuration
# Scrapes edge service health endpoints and MQTT broker metrics.
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  external_labels:
    monitor: mosy-edge
    environment: dev

# ---------------------------------------------------------------------------
# Alerting rules (Alertmanager integration)
# ---------------------------------------------------------------------------
rule_files:
  - /etc/prometheus/rules/*.yml

# ---------------------------------------------------------------------------
# Scrape targets
# ---------------------------------------------------------------------------
scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Mosquitto MQTT broker (via mosquitto-exporter)
  - job_name: mosquitto
    static_configs:
      - targets: ["mosquitto-exporter:9234"]
    metrics_path: /metrics
    scrape_interval: 10s

  # Edge service health endpoints (custom metrics)
  - job_name: edge-services
    static_configs:
      - targets:
          - "fusion-service:8083"
          - "ocr-service:8084"
          - "state-engine:8085"
          - "iot-agent:8086"
          - "vision-service:8087"
          - "safety-service:8088"
        labels:
          group: edge
    metrics_path: /metrics
    scrape_interval: 30s
    # Services expose basic health; /metrics may 404 — mark as up/down
    honor_labels: true

  # MQTT Bridge with HTTP health
  - job_name: mqtt-bridge
    static_configs:
      - targets: ["mqtt-bridge:8081"]
        labels:
          group: edge
    metrics_path: /health
    scrape_interval: 30s

  # Node exporter for host metrics (optional — add node-exporter container)
  # - job_name: node
  #   static_configs:
  #     - targets: ["node-exporter:9100"]
